[preset.0]
name="Windows Portable"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
export_files=PackedStringArray("res://main.tscn")
include_filter="credits.cfg"
exclude_filter="tests/*,tools/*,build/*,save/*,*.md"
export_path="build/portable/EmberRelay.exe"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release="res://build/windows-templates/windows_release_x86_64.exe"
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false

[preset.1]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="credits.cfg"
exclude_filter="tests/*,tools/*,build/*,save/*,web/*,*.md"
export_path="build/web/play/index.html"
script_export_mode=2

[preset.1.options]
custom_template/release="res://build/web-templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/export_icon=true
progressive_web_app/enabled=false
